# K1 (0.10.0 krok 3, S28): ustawienia GTK w obrazie strefy — /etc/gtk-3.0/settings.ini.
# Pusty układ przycisków okna: Firefox (i GTK) nie rysują własnych „minimalizuj / powiększ / zamknij” — w strefie byłyby
# fałszywe (okno należy do K1: minimalizuje i zamyka je pasek tytułu K1 w kolorze sesji, rysowany przez ekran K1).
# Obraz nie ma schematów GNOME (gsettings-desktop-schemas), więc GTK na Waylandzie bierze tę wartość stąd.
[Settings]
gtk-decoration-layout=
