name: Feedback z testu
description: Wrażenia po uruchomieniu wersji K1
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: input
    id: wersja
    attributes:
      label: Wersja
      description: Z nazwy artefaktu k1-<wersja>-obraz albo z logu (linia „K1:”)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: gdzie
    attributes:
      label: Gdzie uruchomione
      options:
        - QEMU (maszyna wirtualna)
        - VMware / VirtualBox
        - Pendrive (prawdziwy komputer)
        - Inne
    validations:
      required: true
  - type: textarea
    id: dobre
    attributes:
      label: Co działa / podoba się
  - type: textarea
    id: zle
    attributes:
      label: Co nie działa / nie podoba się
      description: Możesz wkleić zrzuty ekranu (przeciągnij je tutaj)
  - type: textarea
    id: pomysly
    attributes:
      label: Pomysły na zmiany
