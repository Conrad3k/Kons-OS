name: K1 — budowa i testy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "jadro/**"
      - "testy/**"
      - "scripts/**"
      - "Makefile"
      - "VERSION"
      - ".github/workflows/k1.yml"
  workflow_dispatch:
  # Claude cannot call workflow_dispatch (403): it starts a PR build by adding the label "testy".
  pull_request:
    types: [labeled]

# Nowszy build na main anuluje starszy, który jeszcze trwa (oszczędza minuty).
concurrency:
  group: k1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k1:
    if: github.event_name != 'pull_request' || github.event.label.name == 'testy'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # tag k1-vX.Y.Z po udanym buildzie i testach
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v5

      - name: Odczytaj wersję
        run: echo "K1_WERSJA=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Włącz KVM, jeśli runner go ma (inaczej QEMU użyje emulacji TCG)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "brak /dev/kvm"

      - name: Zainstaluj narzędzia
        timeout-minutes: 10
        run: scripts/przygotuj-srodowisko.sh

      - name: Zbuduj jądro, programy, obrazy i ISO
        run: scripts/zbuduj.sh

      - name: Testy (host + QEMU, także negatywne; M1–M4, start z ISO)
        run: K1_FUZZ_CZAS=30 scripts/testy.sh

      - name: Pokaż logi testów (przy błędzie; artefakty mogą nie mieć miejsca)
        if: failure()
        run: |
          for f in build/testy/m4-*.log build/testy/m2-*.log build/testy/testy-w-systemie.log; do
            [ -f "$f" ] || continue
            echo "===== $f (bez wierszy kursora, ostatnie 150)"
            grep -av "K1-EKRAN: kursor" "$f" | tail -n 150
          done

      - name: Oznacz wersję tagiem (jeśli tagu jeszcze nie ma)
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="k1-v${K1_WERSJA}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} już istnieje — pomijam (czy podbito VERSION?)"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

      - name: Opublikuj obraz ISO jako wydanie (Releases → k1-vX.Y.Z)
        # Wydanie nie zajmuje limitu artefaktów i ma stały adres do pobrania.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="k1-v${K1_WERSJA}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Wydanie $TAG już istnieje — pomijam"
          else
            gh release create "$TAG" "build/wynik/k1-${K1_WERSJA}.iso" "build/wynik/k1-${K1_WERSJA}.iso.sha256" \
              build/wynik/SHA256SUMS --title "Kons K1 ${K1_WERSJA}" \
              --notes "Obraz ISO do uruchomienia w maszynie wirtualnej (UEFI albo BIOS). Instrukcja: README.md, sekcja „Uruchom w maszynie wirtualnej”. Zmiany: CHANGELOG.md."
          fi

      - name: Wyślij obrazy jako artefakt
        # Brak miejsca na artefakty (limit konta) nie może blokować wersji — tag jest wyżej.
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: k1-${{ env.K1_WERSJA }}-obraz
          path: |
            build/wynik/
          retention-days: 30

      - name: Wyślij logi testów (także przy błędzie)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: k1-${{ env.K1_WERSJA }}-logi
          path: |
            build/testy/*.log
            build/testy/*.png
            build/wynik/SHA256SUMS
            build/wynik/srodowisko.txt
          if-no-files-found: ignore
          retention-days: 30
