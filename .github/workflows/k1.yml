name: K1 — budowa i testy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "jadro/**"
      - "testy/**"
      - "scripts/**"
      - "Makefile"
      - "VERSION"
      - ".github/workflows/k1.yml"
  workflow_dispatch:
  # Claude cannot call workflow_dispatch (403): it starts a PR build by adding the label "testy".
  pull_request:
    types: [labeled]

# Nowszy build na main anuluje starszy, który jeszcze trwa (oszczędza minuty).
concurrency:
  group: k1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k1:
    if: github.event_name != 'pull_request' || github.event.label.name == 'testy'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # tag k1-vX.Y.Z po udanym buildzie i testach
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v5

      - name: Odczytaj wersję
        run: echo "K1_WERSJA=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Włącz KVM, jeśli runner go ma (inaczej QEMU użyje emulacji TCG)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "brak /dev/kvm"

      - name: Zainstaluj narzędzia
        timeout-minutes: 10
        run: scripts/przygotuj-srodowisko.sh

      - name: Zbuduj jądro, programy, obrazy i ISO
        # M6a (ADR 0021): the signing key (32 bytes, base64) — a secret the owner adds once in
        # Settings → Secrets and variables → Actions. Without it: an unsigned developer build.
        env:
          K1_KLUCZ_PODPISU: ${{ secrets.K1_KLUCZ_PODPISU }}
        run: |
          set -o pipefail
          mkdir -p build
          scripts/zbuduj.sh 2>&1 | tee build/zbuduj.log
          if grep -q "manifest.*podpisany" build/zbuduj.log && ! grep -q "BEZ podpisu" build/zbuduj.log; then
            echo "K1_PODPIS=podpisane kluczem K1" >> "$GITHUB_ENV"
          else
            echo "K1_PODPIS=wersja deweloperska (bez podpisu — brak sekretu K1_KLUCZ_PODPISU)" >> "$GITHUB_ENV"
          fi

      - name: Testy (host + QEMU, także negatywne; M1–M6, start z ISO)
        run: |
          set -o pipefail
          mkdir -p build/testy
          K1_FUZZ_CZAS=30 scripts/testy.sh 2>&1 | tee build/testy/wynik.txt

      # Logs are always kept in three places that do not depend on the artifact quota:
      # the job console, the job summary and (on main) the release.
      - name: Logi testów — podsumowanie i konsola (zawsze)
        if: always()
        run: |
          {
            echo "## K1 ${K1_WERSJA} — wynik testów"
            echo '```'
            grep -a -E '\[(OK|BŁĄD)\]|wynik|WYNIK|zaliczone|BŁĄD' build/testy/wynik.txt 2>/dev/null || echo "brak wyniku testów"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for f in build/testy/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f (bez wierszy kursora, ostatnie 300)"
            grep -av "K1-EKRAN: kursor" "$f" | tail -n 300
            echo "::endgroup::"
          done

      - name: Spakuj logi testów (zawsze)
        if: always()
        run: |
          tar -czf "build/k1-${K1_WERSJA}-logi.tar.gz" --ignore-failed-read \
            build/testy/*.log build/testy/*.png build/testy/wynik.txt build/wynik/SHA256SUMS \
            build/wynik/srodowisko.txt 2>/dev/null || true
          ls -l "build/k1-${K1_WERSJA}-logi.tar.gz" || true

      - name: Oznacz wersję tagiem (jeśli tagu jeszcze nie ma)
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="k1-v${K1_WERSJA}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} już istnieje — pomijam (czy podbito VERSION?)"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

      - name: Opublikuj obrazy (ISO, USB) jako wydanie (Releases → k1-vX.Y.Z)
        # Wydanie nie zajmuje limitu artefaktów i ma stały adres do pobrania.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="k1-v${K1_WERSJA}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Wydanie $TAG już istnieje — pomijam"
          else
            gh release create "$TAG" "build/wynik/k1-${K1_WERSJA}.iso" "build/wynik/k1-${K1_WERSJA}.iso.sha256" \
              "build/wynik/k1-${K1_WERSJA}-usb.img.xz" "build/wynik/k1-${K1_WERSJA}-usb.img.xz.sha256" \
              build/wynik/SHA256SUMS "build/k1-${K1_WERSJA}-logi.tar.gz" --title "Kons K1 ${K1_WERSJA}" \
              --notes "k1-${K1_WERSJA}-usb.img.xz — na pendrive ≥ 512 MB (laptop, UEFI): system i zaszyfrowane miejsce na dane (Rufus/balenaEtcher). k1-${K1_WERSJA}.iso — do maszyny wirtualnej (UEFI albo BIOS), bez zapisu danych. Instrukcja: README.md. Zmiany: CHANGELOG.md. System: ${K1_PODPIS}."
          fi

      - name: Wyślij obrazy jako artefakt (tylko PR — na main obraz jest w wydaniu)
        # Brak miejsca na artefakty (limit konta) nie może blokować wersji — tag jest wyżej.
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: k1-${{ env.K1_WERSJA }}-obraz
          path: |
            build/wynik/
            !build/wynik/*-usb.img
          retention-days: 7

      - name: Wyślij logi testów jako artefakt (zawsze; dodatkowo do konsoli i wydania)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: k1-${{ env.K1_WERSJA }}-logi
          path: build/k1-${{ env.K1_WERSJA }}-logi.tar.gz
          if-no-files-found: ignore
          retention-days: 7
