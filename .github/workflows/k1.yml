name: K1 — budowa i testy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "jadro/**"
      - "testy/**"
      - "scripts/**"
      - "Makefile"
      - "VERSION"
      - ".github/workflows/k1.yml"
  workflow_dispatch:
  # Claude cannot call workflow_dispatch (403): it starts a PR build by adding the label "testy".
  pull_request:
    types: [labeled]

# Nowszy build na main anuluje starszy, który jeszcze trwa (oszczędza minuty).
concurrency:
  group: k1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k1:
    # "testy": the full set (before every merge).
    if: github.event_name != 'pull_request' || github.event.label.name == 'testy'
    runs-on: ubuntu-24.04
    # Room for a build with no cache (the first one after the kernel or the download tables change) plus the tests.
    timeout-minutes: 80
    permissions:
      contents: write   # tag k1-vX.Y.Z po udanym buildzie i testach
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v5

      - name: Odczytaj wersję
        run: echo "K1_WERSJA=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Włącz KVM, jeśli runner go ma (inaczej QEMU użyje emulacji TCG)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "brak /dev/kvm"

      # A copy of the downloaded packages in the Actions cache (not the artifact quota): when Ubuntu's
      # mirrors do not answer, the tools install from it (scripts/przygotuj-srodowisko.sh, K1_APT_ZAPAS).
      # The key follows the runner image and the package list, so a copy fits the system it goes on.
      - name: Klucz kopii pakietów
        id: klucz-apt
        run: echo "klucz=k1-apt-${ImageOS:-ubuntu}-${ImageVersion:-0}-${{ hashFiles('scripts/przygotuj-srodowisko.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Przywróć kopię pakietów (pamięć podręczna)
        id: zapas-apt
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/k1-apt-zapas
          key: ${{ steps.klucz-apt.outputs.klucz }}
          restore-keys: k1-apt-

      - name: Zainstaluj narzędzia
        timeout-minutes: 10
        env:
          K1_APT_ZAPAS: ${{ runner.temp }}/k1-apt-zapas
        run: scripts/przygotuj-srodowisko.sh

      - name: Zapisz kopię pakietów (pamięć podręczna)
        if: steps.zapas-apt.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/k1-apt-zapas
          key: ${{ steps.klucz-apt.outputs.klucz }}

      # D4 (0.9.0 step 9, the owner's decision): the kernel's build directory in the Actions cache, for the test runs of
      # PRs only (label "testy") — the kernel then builds incrementally (about 7 of 30 minutes less). A build on main
      # (a release) never starts from it: it builds the kernel from zero and saves the result for the PRs. The key:
      # the kernel's version and configuration and the scripts that build it. Nothing secret is in it (no modules, no
      # module keys; the Secure Boot key lives in build/gen, not here).
      - name: Klucz pamięci podręcznej jądra
        id: klucz-jadra
        run: echo "klucz=k1-jadro-${{ hashFiles('jadro/**', 'scripts/wspolne.sh', 'scripts/zbuduj-jadro.sh', 'scripts/oprogramowanie-kart.sh', 'scripts/zbuduj-k1efi.sh', 'scripts/sprawdz-konfiguracje-jadra.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Przywróć zbudowane jądro (tylko PR — wydanie zawsze od zera)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/jadro-obj
            build/naglowki
          key: ${{ steps.klucz-jadra.outputs.klucz }}

      # The downloads (the kernel's and musl's sources, the firmware, the regulatory database, the zone's Debian
      # packages, the firmware for the test machines) in the Actions cache: each is still checked by its SHA-256 (or
      # signature) at every build, so a copy from the cache is the same file — but a slow server no longer holds the
      # build (runs 83 and 87 of PR #119 waited an hour on git.kernel.org). The key: the tables of what is downloaded.
      - name: Klucz pamięci podręcznej pobranych plików
        id: klucz-pobranych
        run: echo "klucz=k1-pobrane-${{ hashFiles('scripts/wspolne.sh', 'jadro/oprogramowanie-kart.txt', 'strefy/przegladarka.txt') }}" >> "$GITHUB_OUTPUT"

      - name: Przywróć pobrane pliki (pamięć podręczna)
        id: pobrane
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/pobrane
            build/strefa-pakiety
          key: ${{ steps.klucz-pobranych.outputs.klucz }}
          restore-keys: k1-pobrane-

      - name: Zbuduj jądro, programy, obrazy i ISO
        timeout-minutes: 50
        # M6a (ADR 0021): the signing key (32 bytes, base64) — a secret the owner adds once in
        # Settings → Secrets and variables → Actions. Without it: an unsigned developer build.
        env:
          K1_KLUCZ_PODPISU: ${{ secrets.K1_KLUCZ_PODPISU }}
        run: |
          set -o pipefail
          mkdir -p build
          scripts/zbuduj.sh 2>&1 | tee build/zbuduj.log
          if grep -q "manifest.*podpisany" build/zbuduj.log && ! grep -q "BEZ podpisu" build/zbuduj.log; then
            echo "K1_PODPIS=podpisane kluczem K1" >> "$GITHUB_ENV"
          else
            echo "K1_PODPIS=wersja deweloperska (bez podpisu — brak sekretu K1_KLUCZ_PODPISU)" >> "$GITHUB_ENV"
          fi

      - name: Zapisz pobrane pliki (pamięć podręczna)
        if: steps.pobrane.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/pobrane
            build/strefa-pakiety
          key: ${{ steps.klucz-pobranych.outputs.klucz }}

      - name: Zapisz zbudowane jądro dla PR-ów (tylko main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/jadro-obj
            build/naglowki
          key: ${{ steps.klucz-jadra.outputs.klucz }}

      # 0.10.0: the fuzzers' corpus (inputs that reach new code) is kept between runs in the Actions cache, so each
      # run goes deeper instead of starting from nothing. Only generated test inputs, nothing secret.
      - name: Przywróć korpus fuzzingu (pamięć podręczna)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: build/fuzz-korpus-*
          key: k1-fuzz-${{ github.run_id }}
          restore-keys: k1-fuzz-

      # Its own limit, below the job's: a test that hangs ends here, and the steps after it still save the logs
      # (CI run 125: no step limit, the run was stopped by hand with no result).
      - name: Testy (host + QEMU, także negatywne; M1–M6, start z ISO)
        timeout-minutes: 45
        run: |
          set -o pipefail
          mkdir -p build/testy
          K1_FUZZ_CZAS=30 scripts/testy.sh 2>&1 | tee build/testy/wynik.txt

      - name: Zapisz korpus fuzzingu (pamięć podręczna)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/fuzz-korpus-*
          key: k1-fuzz-${{ github.run_id }}

      # Logs are always kept in three places that do not depend on the artifact quota:
      # the job console, the job summary and (on main) the release.
      - name: Logi testów — podsumowanie i konsola (zawsze)
        if: always()
        run: |
          {
            echo "## K1 ${K1_WERSJA} — wynik testów"
            echo '```'
            grep -a -E '\[(OK|BŁĄD)\]|wynik|WYNIK|zaliczone|BŁĄD' build/testy/wynik.txt 2>/dev/null || echo "brak wyniku testów"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for f in build/testy/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f (bez wierszy kursora, ostatnie 300)"
            grep -av "K1-EKRAN: kursor" "$f" | tail -n 300
            echo "::endgroup::"
          done
          # once more at the very end: the end of a long log is what one reads first (and all the API returns)
          echo "=== K1 ${K1_WERSJA}: podsumowanie testów (niezaliczone i wynik) ==="
          # with what a failed check printed under it (its lines start with "            |": the last lines of the
          # system, the zone's and nadzorca's counts) — 0.10.0 step 2
          grep -a -E '\[BŁĄD\]|\[uwaga\]|^\[k1\]|Traceback|Error|^            \| ' build/testy/wynik.txt 2>/dev/null |
            tail -n 260 || echo "brak wyniku testów"
          if grep -aq 'BŁĄD.*fuzzing' build/testy/wynik.txt 2>/dev/null; then
            echo "=== fuzzing: co znalazł (build/testy/fuzz.log) ==="
            grep -a -E 'ERROR|SUMMARY|crash-|leak-|timeout-|oom-|Test unit written|deadly|BŁĄD|==[0-9]+==' build/testy/fuzz.log |
              tail -n 40
          fi

      - name: Spakuj logi testów (zawsze)
        if: always()
        run: |
          tar -czf "build/k1-${K1_WERSJA}-logi.tar.gz" --ignore-failed-read \
            build/testy/*.log build/testy/*.png build/testy/wynik.txt build/wynik/SHA256SUMS \
            build/wynik/srodowisko.txt 2>/dev/null || true
          ls -l "build/k1-${K1_WERSJA}-logi.tar.gz" || true

      - name: Oznacz wersję tagiem (jeśli tagu jeszcze nie ma)
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="k1-v${K1_WERSJA}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} już istnieje — pomijam (czy podbito VERSION?)"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

      - name: Opublikuj obrazy (ISO, USB) jako wydanie (Releases → k1-vX.Y.Z)
        # Wydanie nie zajmuje limitu artefaktów i ma stały adres do pobrania.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="k1-v${K1_WERSJA}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Wydanie $TAG już istnieje — pomijam"
          else
            gh release create "$TAG" "build/wynik/k1-${K1_WERSJA}.iso" "build/wynik/k1-${K1_WERSJA}.iso.sha256" \
              "build/wynik/k1-${K1_WERSJA}-usb.img.xz" "build/wynik/k1-${K1_WERSJA}-usb.img.xz.sha256" \
              build/wynik/SHA256SUMS "build/k1-${K1_WERSJA}-logi.tar.gz" --title "Kons K1 ${K1_WERSJA}" \
              --notes "k1-${K1_WERSJA}-usb.img.xz — na pendrive ≥ 512 MB (laptop, UEFI): system i zaszyfrowane miejsce na dane (Rufus/balenaEtcher). k1-${K1_WERSJA}.iso — do maszyny wirtualnej (UEFI albo BIOS), bez zapisu danych. Instrukcja: README.md. Zmiany: CHANGELOG.md. System: ${K1_PODPIS}."
          fi

      - name: Wyślij obrazy jako artefakt (tylko PR — na main obraz jest w wydaniu)
        # Brak miejsca na artefakty (limit konta) nie może blokować wersji — tag jest wyżej.
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: k1-${{ env.K1_WERSJA }}-obraz
          path: |
            build/wynik/
            !build/wynik/*-usb.img
          retention-days: 7

      - name: Wyślij logi testów jako artefakt (zawsze; dodatkowo do konsoli i wydania)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: k1-${{ env.K1_WERSJA }}-logi
          path: build/k1-${{ env.K1_WERSJA }}-logi.tar.gz
          if-no-files-found: ignore
          retention-days: 7
