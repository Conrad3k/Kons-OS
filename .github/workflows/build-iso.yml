name: Zbuduj ISO Kons-OS

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "build.sh"
      - "VERSION"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

# Nowszy build na main anuluje starszy, który jeszcze trwa (oszczędza minuty).
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # do tworzenia tagu wersji po udanym buildzie
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v5

      - name: Odczytaj wersję
        run: echo "KONS_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Zwolnij miejsce na dysku
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Zbuduj ISO w kontenerze Debian 13
        run: |
          docker run --rm --privileged \
            -v "$PWD":/build -w /build \
            debian:trixie \
            bash -c "apt-get update && apt-get install -y live-build && ./build.sh"

      - name: Pokaż wynik
        run: ls -lh *.iso

      - name: Wyślij ISO jako artefakt
        uses: actions/upload-artifact@v5
        with:
          name: kons-os-${{ env.KONS_VERSION }}-iso
          path: "*.iso"
          compression-level: 0
          retention-days: 30

      - name: Oznacz wersję tagiem (tylko main, jeśli tagu jeszcze nie ma)
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="v${KONS_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} już istnieje — pomijam (czy podbito VERSION?)"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

      - name: Wyślij log buildu (także przy błędzie)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-${{ env.KONS_VERSION }}
          path: build.log
          if-no-files-found: ignore
