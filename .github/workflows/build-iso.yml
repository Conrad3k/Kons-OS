name: Zbuduj ISO Kons-OS

on:
  push:
    paths:
      - "config/**"
      - "build.sh"
      - "VERSION"
      - ".github/workflows/build-iso.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zwolnij miejsce na dysku
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Zbuduj ISO w kontenerze Debian 13
        run: |
          docker run --rm --privileged \
            -v "$PWD":/build -w /build \
            debian:trixie \
            bash -c "apt-get update && apt-get install -y live-build && ./build.sh"

      - name: Pokaż wynik
        run: ls -lh *.iso

      - name: Wyślij ISO jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: kons-os-iso
          path: "*.iso"
          compression-level: 0
          retention-days: 14

      - name: Wyślij log buildu (także przy błędzie)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
